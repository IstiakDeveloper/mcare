<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#059669">
        <meta name="robots" content="noindex">
        <title>Offline — M Care</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml">
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f7fbf8;
                --fg: #163127;
                --muted: #5b7368;
                --card: #ffffff;
                --primary: #059669;
                --ring: rgba(5, 150, 105, 0.18);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #14241c;
                    --fg: #eff7f3;
                    --muted: #9bb5aa;
                    --card: #1b2e25;
                    --primary: #34d399;
                    --ring: rgba(52, 211, 153, 0.2);
                }
            }

            * { box-sizing: border-box; }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 1.5rem;
                font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
                background:
                    radial-gradient(circle at top right, var(--ring), transparent 36%),
                    radial-gradient(circle at bottom left, var(--ring), transparent 32%),
                    var(--bg);
                color: var(--fg);
            }

            main {
                width: min(28rem, 100%);
                background: var(--card);
                border: 1px solid var(--ring);
                border-radius: 1.5rem;
                padding: 2rem 1.5rem 1.5rem;
                text-align: center;
                box-shadow: 0 18px 40px rgba(15, 41, 32, 0.08);
            }

            img {
                width: 4.5rem;
                height: 4.5rem;
                border-radius: 1.15rem;
            }

            h1 {
                margin: 1rem 0 0.4rem;
                font-size: 1.35rem;
                letter-spacing: -0.02em;
            }

            p {
                margin: 0;
                color: var(--muted);
                line-height: 1.5;
                font-size: 0.95rem;
            }

            .actions {
                display: flex;
                gap: 0.75rem;
                justify-content: center;
                margin-top: 1.5rem;
            }

            button, a {
                appearance: none;
                border: 0;
                border-radius: 0.85rem;
                padding: 0.7rem 1rem;
                font: inherit;
                font-weight: 650;
                text-decoration: none;
                cursor: pointer;
            }

            button {
                background: var(--primary);
                color: #fff;
            }

            a {
                background: transparent;
                color: var(--fg);
                border: 1px solid var(--ring);
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="M Care">
            <h1>You're offline</h1>
            <p>M Care needs a connection to load the latest field records. Reconnect and try again.</p>
            <div class="actions">
                <button type="button" onclick="location.reload()">Try again</button>
                <a href="/">Go home</a>
            </div>
        </main>
    </body>
</html>
